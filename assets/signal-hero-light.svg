<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title" style="--bg:#fcfdfc;--panel:#f2f6f3;--ink:#14261f;--muted:#53665b;--line:#dae5dc;--accent:#178262">
<title id="title">Akshat Mishra — Building apps. Improving open source. Python, TypeScript and SQL.</title>
<style>
text{font-family:'Segoe UI',Arial,sans-serif} .muted{fill:var(--muted)}
.signal{animation:wave 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.packet{stroke-dasharray:30 300;animation:travel 7s linear infinite}
.trace{animation:trace 7s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
.orbit{animation:orbit 18s linear infinite;transform-origin:1050px 195px}
.check{animation:check 7s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleY(.5);opacity:.35}50%{transform:scaleY(1);opacity:.9}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.45}50%{transform:scale(1.15);opacity:1}}
@keyframes travel{to{stroke-dashoffset:-660}}
@keyframes trace{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes check{0%,100%{opacity:.4}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="glow"><stop stop-color="#178262" stop-opacity=".16"/><stop offset="1" stop-color="#fcfdfc" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="440" rx="22" fill="#fcfdfc"/>

<ellipse cx="1000" cy="160" rx="330" ry="270" fill="url(#glow)"/>
<circle class="pulse" cx="51" cy="54" r="6" fill="#178262"/>
<text x="72" y="62" fill="#53665b" font-size="24" letter-spacing="4">AKSHAT MISHRA</text>
<text x="44" y="168" fill="#14261f" font-size="76" font-weight="600" letter-spacing="-4">Building apps.</text>
<text x="44" y="255" fill="#14261f" font-size="76" font-weight="600" letter-spacing="-4">Improving open source.</text>
<text x="47" y="323" fill="#53665b" font-size="28">Python · TypeScript · SQL</text>
<text x="47" y="371" fill="#53665b" font-size="24">Build with purpose. Follow the evidence. Keep improving.</text>
